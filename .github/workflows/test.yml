name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: "Regenerate the Linux screenshot baselines (uploaded as an artifact to review and commit)"
        type: boolean
        default: false

jobs:
  unit:
    name: unit · data · golden physics · simulation sections (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - name: Upload simulation cross-section diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: "section-diffs-node${{ matrix.node }}", path: test-results/sections, if-no-files-found: ignore }

  browser:
    name: browser · functional · mobile · screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Update Linux screenshot baselines
        if: inputs.update_screenshots
        run: npx playwright test --project=desktop --project=mobile -g "scene|UI|screenshots" --update-snapshots
      - name: Upload new baselines
        if: inputs.update_screenshots
        uses: actions/upload-artifact@v4
        with: { name: linux-screenshot-baselines, path: "tests/e2e/__screenshots__/*/linux" }
      - name: Functional, mobile and screenshot tests
        if: ${{ !inputs.update_screenshots }}
        run: |
          # screenshot baselines are per-platform; until Linux ones are committed
          # (run this workflow with update_screenshots), compare functionally only
          if ls tests/e2e/__screenshots__/*/linux >/dev/null 2>&1; then
            npx playwright test --project=desktop --project=mobile
          else
            echo "::warning::No Linux screenshot baselines yet — skipping screenshot comparison"
            npx playwright test --project=desktop --project=mobile --grep-invert "scene|UI|screenshots"
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report }

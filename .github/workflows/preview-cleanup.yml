name: preview cleanup

# Deletes a PR's preview deployments from the lifty-preview Pages project when
# the PR is closed or merged. pull_request_target gives access to the secrets;
# that is safe here because this workflow never checks out or runs the PR's
# code — it only uses the PR number from the event.

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete pr-<n> deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/lifty-preview/deployments"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ids=""
          for page in $(seq 1 20); do
            res=$(curl -sf -H "$auth" "$api?env=preview&per_page=25&page=$page")
            [ "$(echo "$res" | jq '.result | length')" = 0 ] && break
            ids="$ids $(echo "$res" | jq -r --arg b "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id')"
          done
          for id in $ids; do
            curl -sf -X DELETE -H "$auth" "$api/$id?force=true" > /dev/null && echo "deleted $id"
          done
          echo "done"
